# The submission is judged from 2026-09-09 to 2026-09-23 against the live URL. Nobody is watching
# the origin for those two weeks, so this job fetches every route a judge can reach, every half
# hour, as a stranger. It goes red the moment one of them stops answering. A paid endpoint
# answers 402 by design and everything else must answer 200.
name: canary
on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
jobs:
  fetch-as-a-stranger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: every route answers
        run: |
          base=https://muster.zkasuran.dev
          fail=0
          check() {
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 -A 'Mozilla/5.0 (canary)' "$1")
            if [ "$code" = "$2" ]; then echo "ok   $code $1"; else echo "FAIL $code (want $2) $1"; fail=$((fail+1)); fi
          }
          for p in / /shelf/rebalancing /shelf/grid-trading /shelf/yield /shelf/health-factor /agent/900000001 /compare /search /status /report /hire/yield; do
            check "$base$p" 200
          done
          for s in rebalancing grid-trading yield health-factor; do
            check "$base/api/agent/$s" 402
            check "$base/api/agent/$s?preview=1" 200
          done
          exit $fail
